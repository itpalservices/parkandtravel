<div class="bookings-table-wrapper">
  <ngx-datatable
    class="bootstrap-table"
    [rows]="bookings"
    [columnMode]="'force'"
    [headerHeight]="50"
    [rowHeight]="'auto'"
    [scrollbarH]="false"
    [footerHeight]="0"
  >
    <ngx-datatable-column name="Name" [width]="180" [sortable]="false">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div class="name-cell">
          <span class="customer-name">{{ row.name }} {{ row.surname }}</span>
          <span class="customer-email">{{ row.email }}</span>
        </div>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="" [width]="400" [sortable]="false">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div class="details-cell">
          <div class="detail-row">
            <span class="detail-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
            <span class="detail-value">{{ formatDateRange(row) }}</span>
          </div>
          <div class="detail-row">
            <span class="detail-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
              </svg>
            </span>
            <span class="detail-value plate-number">{{ row.plateNo }}</span>
            <span class="detail-separator">|</span>
            <span class="detail-value car-details">{{ formatCarDetails(row) }}</span>
          </div>
          <div class="detail-row">
            <span class="detail-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
              </svg>
            </span>
            <span class="detail-label">Parking:</span>
            <span class="detail-value parking-type">{{ row.parkingType?.name || 'Standard' }}</span>
            <span class="detail-separator">|</span>
            <span class="detail-label">Adults:</span>
            <span class="detail-value">{{ row.adults }}</span>
          </div>
          @if (row.returnFlight) {
            <div class="detail-row">
              <span class="detail-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
                </svg>
              </span>
              <span class="detail-label">Return Flight:</span>
              <span class="detail-value flight-number">{{ row.returnFlight }}</span>
            </div>
          }
        </div>
      </ng-template>
    </ngx-datatable-column>

    <ngx-datatable-column name="" [width]="60" [sortable]="false" [cellClass]="'actions-cell'" [headerClass]="'actions-header'">
      <ng-template let-row="row" ngx-datatable-cell-template>
        <div class="actions-wrapper" ngbDropdown placement="bottom-end">
          <button class="btn btn-icon" ngbDropdownToggle>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
          <div ngbDropdownMenu class="dropdown-menu-end">
            <button ngbDropdownItem (click)="onEdit(row)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              Edit
            </button>
            <button ngbDropdownItem class="text-danger" (click)="onDelete(row)">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
              Delete
            </button>
          </div>
        </div>
      </ng-template>
    </ngx-datatable-column>
  </ngx-datatable>
</div>
