<div class="bookings-page">
  <div class="container-fluid px-3 px-md-4">
    <div class="page-header mb-4">
      <h1 class="page-title">Bookings</h1>
    </div>

    <div class="filters-bar mb-4">
      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <div class="search-box">
            <span class="search-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input
              type="text"
              class="form-control search-input"
              placeholder="Search by name, email, plate..."
              [(ngModel)]="searchTerm"
              (ngModelChange)="onSearchChange()"
            />
          </div>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <div class="date-picker-wrapper">
            <label class="date-label">From</label>
            <input
              class="form-control date-input"
              placeholder="Select date"
              name="dateFrom"
              [(ngModel)]="dateFrom"
              ngbDatepicker
              #dpFrom="ngbDatepicker"
              (click)="dpFrom.toggle()"
              (ngModelChange)="onDateFromChange()"
              readonly
            />
            <span class="calendar-icon" (click)="dpFrom.toggle()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
          </div>
        </div>
        <div class="col-6 col-md-3 col-lg-2">
          <div class="date-picker-wrapper">
            <label class="date-label">To</label>
            <input
              class="form-control date-input"
              placeholder="Select date"
              name="dateTo"
              [(ngModel)]="dateTo"
              ngbDatepicker
              #dpTo="ngbDatepicker"
              (click)="dpTo.toggle()"
              (ngModelChange)="onDateToChange()"
              readonly
            />
            <span class="calendar-icon" (click)="dpTo.toggle()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="bookings-content">
      @if (loading) {
        <div class="loading-spinner text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      } @else if (bookings.length === 0) {
        <div class="no-bookings text-center py-5">
          <p class="text-muted mb-0">No bookings found</p>
        </div>
      } @else {
        <div class="d-none d-md-block">
          <app-bookings-table [bookings]="bookings"></app-bookings-table>
        </div>
        <div class="d-block d-md-none">
          <app-bookings-mobile-list [bookings]="bookings"></app-bookings-mobile-list>
        </div>
      }
    </div>
  </div>
</div>
