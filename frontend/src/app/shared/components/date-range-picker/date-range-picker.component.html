<div class="date-range-picker">
  <button class="date-trigger-btn" (click)="toggleDropdown()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <span class="date-text">{{ displayRangeText }}</span>
  </button>

  @if (isOpen) {
    <div class="dropdown-panel" [class.expanded]="showCustomRange">
      <div class="presets-list">
        @for (preset of presets; track preset.id) {
          <button 
            class="preset-btn" 
            [class.active]="activePreset === preset.id"
            (click)="selectPreset(preset.id)"
          >
            {{ preset.label }}
          </button>
        }
      </div>

      @if (showCustomRange) {
        <div class="custom-range-panel">
          <div class="calendars-container">
            <div class="calendar-wrapper">
              <ngb-datepicker
                #dpFrom
                [(ngModel)]="fromDate"
                [minDate]="minDate"
                [markDisabled]="isDateDisabled"
                [displayMonths]="1"
                navigation="arrows"
              ></ngb-datepicker>
            </div>
            <div class="calendar-wrapper">
              <ngb-datepicker
                #dpTo
                [(ngModel)]="toDate"
                [minDate]="minDate"
                [markDisabled]="isDateDisabled"
                [displayMonths]="1"
                navigation="arrows"
              ></ngb-datepicker>
            </div>
          </div>
          <div class="custom-range-footer">
            <span class="selected-range">
              {{ formatNgbDate(fromDate) }} - {{ formatNgbDate(toDate) }}
            </span>
            <button class="apply-btn" (click)="applyCustomRange()" [disabled]="!fromDate || !toDate">
              Apply
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
