<div class="carousel-overlay" (click)="onBackdropClick($event)">
  <div class="carousel-container">
    <button class="carousel-close" (click)="close()" aria-label="Close">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <div class="carousel-content">
      @if (total > 1) {
        <button class="carousel-nav carousel-prev" (click)="prev()" aria-label="Previous">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      }

      <div class="carousel-image-wrapper">
        <img [src]="currentImage" alt="Photo {{ currentIndex + 1 }} of {{ total }}" />
        @if (currentImageTimestamp) {
          <span class="carousel-timestamp">{{ currentImageTimestamp }}</span>
        }
      </div>

      @if (total > 1) {
        <button class="carousel-nav carousel-next" (click)="next()" aria-label="Next">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      }
    </div>

    @if (total > 1) {
      <div class="carousel-counter">{{ currentIndex + 1 }} / {{ total }}</div>
    }
  </div>
</div>
