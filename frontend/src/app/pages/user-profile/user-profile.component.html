<div class="user-profile-page">
  <div class="page-header">
    <h2>User Profile</h2>
  </div>

  <div class="profile-section">
    @if (loading) {
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Loading profile...</p>
      </div>
    } @else if (loadError) {
      <div class="error-container">
        <div class="error-message">{{ loadError }}</div>
        <button class="btn btn-primary" (click)="loadProfile()">Try Again</button>
      </div>
    } @else {
      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        @if (saveError) {
          <div class="alert alert-danger">{{ saveError }}</div>
        }

        <div class="form-section">
          <div class="form-group">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              class="form-control"
              formControlName="email"
              placeholder="Email"
            />
            <small class="form-text text-muted">Email cannot be changed</small>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="name">Name *</label>
              <input
                type="text"
                id="name"
                class="form-control"
                [class.is-invalid]="hasError('name')"
                formControlName="name"
                placeholder="Enter your name"
              />
              <app-form-field-error [control]="f['name']" fieldName="Name"> </app-form-field-error>
            </div>

            <div class="form-group">
              <label for="surname">Surname *</label>
              <input
                type="text"
                id="surname"
                class="form-control"
                [class.is-invalid]="hasError('surname')"
                formControlName="surname"
                placeholder="Enter your surname"
              />
              <app-form-field-error [control]="f['surname']" fieldName="Surname">
              </app-form-field-error>
            </div>
          </div>

          <div class="form-group">
            <label>Phone *</label>
            <div class="phone-input-group">
              <div ngbDropdown class="phone-code-dropdown">
                <button
                  type="button"
                  class="btn btn-outline-secondary dropdown-toggle phone-code-btn"
                  ngbDropdownToggle
                >
                  @if (selectedPhoneCode) {
                    <img
                      [src]="getFlagUrl(selectedPhoneCode.isoCode)"
                      [alt]="selectedPhoneCode.isoCode"
                      class="flag-icon"
                    />
                    <span>{{ selectedPhoneCode.phoneCode }}</span>
                  } @else {
                    <span>Select</span>
                  }
                </button>
                <div ngbDropdownMenu class="phone-code-menu">
                  <div class="phone-search-container">
                    <input
                      type="text"
                      class="phone-search-input"
                      placeholder="Search country or code..."
                      [(ngModel)]="phoneCodeSearch"
                      [ngModelOptions]="{ standalone: true }"
                      (click)="$event.stopPropagation()"
                    />
                  </div>
                  <div class="phone-codes-list">
                    @for (code of filteredPhoneCodes; track code.id) {
                      <button
                        type="button"
                        ngbDropdownItem
                        (click)="selectPhoneCode(code)"
                        class="phone-code-item"
                      >
                        <img
                          [src]="getFlagUrl(code.isoCode)"
                          [alt]="code.isoCode"
                          class="flag-icon"
                        />
                        <span class="phone-code-text">{{ code.phoneCode }}</span>
                        <span class="country-code-text">{{ code.isoCode }}</span>
                      </button>
                    }
                  </div>
                </div>
              </div>
              <input
                type="tel"
                id="phone"
                class="form-control phone-number-input"
                [class.is-invalid]="hasError('phone')"
                formControlName="phone"
                placeholder="99123456"
              />
            </div>
            <app-form-field-error
              [control]="f['phone']"
              fieldName="Phone number"
              [customMessages]="{ pattern: 'Please enter a valid phone number (digits only)' }"
            >
            </app-form-field-error>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" [disabled]="saving">
            @if (saving) {
              <span class="btn-spinner"></span>
              Saving...
            } @else {
              Save Changes
            }
          </button>
        </div>
      </form>
    }
  </div>
</div>
