<div class="page-container">
  <div class="page-header">
    <div class="header-left">
      <a routerLink="/admin/reports" class="btn-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back
      </a>
      <h1 class="page-title">Z Reports History</h1>
    </div>
    <app-date-range-picker
      [selectedPreset]="dateFilter.preset"
      [selectedFromDate]="dateFilter.from"
      [selectedToDate]="dateFilter.to"
      [enablePastDates]="true"
      [showPastOptions]="true"
      (dateRangeChange)="onDateRangeChange($event)"
    ></app-date-range-picker>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <div class="table-wrapper" *ngIf="!loading && reports.length > 0">
    <table class="report-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Employee</th>
          <th>Run by</th>
          <th class="text-right">Actual Total</th>
          <th class="text-center">Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reports" (click)="viewDetail(r.id)" class="clickable-row">
          <td>{{ formatDateTime(r.createdAt) }}</td>
          <td class="font-medium">{{ r.targetUserName }}</td>
          <td class="text-muted">{{ r.runByUserName }}</td>
          <td class="text-right font-medium">€{{ (r.actualCash + r.actualCard).toFixed(2) }}</td>
          <td class="text-center">
            <span class="status-badge" [class.status-badge--match]="isMatch(r)" [class.status-badge--mismatch]="!isMatch(r)">
              {{ isMatch(r) ? 'Match' : 'Mismatch' }}
            </span>
          </td>
          <td class="text-right">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="!loading && reports.length === 0">
    <p>No Z reports found for the selected period.</p>
  </div>
</div>
