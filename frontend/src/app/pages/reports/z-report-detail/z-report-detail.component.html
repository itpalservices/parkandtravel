<div class="page-container">
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <ng-container *ngIf="!loading && report">
    <div class="page-header">
      <div class="header-left">
        <a routerLink="/admin/reports/z-reports" class="btn-back">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back
        </a>
        <h1 class="page-title">Z Report Detail</h1>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" (click)="printThermal()" [disabled]="printing">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          {{ printing ? 'Printing...' : 'Print' }}
        </button>
        <div ngbDropdown container="body">
          <button class="btn-export" ngbDropdownToggle [disabled]="exporting">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            {{ exporting ? 'Exporting...' : 'Export' }}
          </button>
          <div ngbDropdownMenu>
            <button ngbDropdownItem type="button" (click)="exportPDF()">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              Export as PDF
            </button>
            <button ngbDropdownItem type="button" (click)="exportExcel()">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="8" y1="8" x2="16" y2="16"></line>
                <line x1="16" y1="8" x2="8" y2="16"></line>
              </svg>
              Export as Excel
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="result-meta">
      <span><strong>Run by:</strong> {{ report.runByUserName }}</span>
      <span><strong>Date:</strong> {{ formatDateTime(report.createdAt) }}</span>
      <span><strong>Employees:</strong> {{ report.employees.length }}</span>
    </div>

    <app-z-report-summary [data]="report"></app-z-report-summary>
  </ng-container>
</div>
