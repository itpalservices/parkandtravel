<div class="page-container">

  <!-- CONFIRMING STEP: the SweetAlert popup is the actual UI here; this is just a loading state -->
  <ng-container *ngIf="step === 'confirming'">
    <div class="page-header">
      <h1 class="page-title">Z Report</h1>
    </div>
    <div class="loading-state" *ngIf="submitting">
      <div class="spinner"></div>
      <p>Creating Z Report...</p>
    </div>
  </ng-container>

  <!-- RESULT STEP -->
  <ng-container *ngIf="step === 'result' && result">
    <div class="page-header">
      <div class="header-left">
        <button class="btn-back" (click)="goBack()">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back
        </button>
        <h1 class="page-title">Z Report — Created</h1>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" (click)="viewHistory()">View History</button>
        <button class="btn-secondary" (click)="printThermal()" [disabled]="printing">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          {{ printing ? 'Printing...' : 'Print' }}
        </button>
        <button class="btn-export" (click)="exportPDF()" [disabled]="exporting">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          {{ exporting ? 'Exporting...' : 'Export PDF' }}
        </button>
      </div>
    </div>

    <div class="result-meta">
      <span><strong>Run by:</strong> {{ result.runByUserName }}</span>
      <span><strong>Date:</strong> {{ formatDateTime(result.createdAt) }}</span>
      <span><strong>Employees:</strong> {{ result.employees.length }}</span>
    </div>

    <app-z-report-summary [data]="result"></app-z-report-summary>
  </ng-container>

</div>
