<div class="bookings-page">
  <div class="page-header d-none d-md-block">
    <div class="header-row">
      <div class="header-left">
        <h1 class="page-title">Bookings</h1>
        <div class="search-box">
          <input
            type="text"
            class="form-control search-input"
            placeholder="Search for..."
            [(ngModel)]="searchTerm"
            (ngModelChange)="onSearchChange()"
          />
          <span class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
        </div>
      </div>
      <div class="header-right">
        <app-date-range-picker
          [selectedPreset]="dateFilter.preset"
          (dateRangeChange)="onDateRangeChange($event)"
        ></app-date-range-picker>
      </div>
    </div>
  </div>

  <div class="mobile-controls d-md-none">
    <h1 class="page-title mb-2">Bookings</h1>
    
    <div class="mobile-search-row">
      <div class="mobile-search-box">
        <span class="search-icon-left">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input
          type="text"
          class="form-control"
          placeholder="Enter Customer Name, License Plate, or Flight"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
        />
        <button class="search-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="date-range-row">
      <app-date-range-picker
        [selectedPreset]="dateFilter.preset"
        (dateRangeChange)="onDateRangeChange($event)"
      ></app-date-range-picker>
    </div>
  </div>

  <div class="bookings-content">
    @if (loading) {
      <div class="loading-spinner text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    } @else if (errorMessage) {
      <div class="error-message text-center py-5">
        <div class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>
        <button class="btn btn-primary" (click)="loadBookings()">Try Again</button>
      </div>
    } @else if (filteredBookings.length === 0) {
      <div class="no-bookings text-center py-5">
        <p class="text-muted mb-0">No bookings found</p>
      </div>
    } @else {
      <app-bookings-list 
        [bookings]="paginatedBookings"
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [pageNumbers]="pageNumbers"
        (pageChange)="onPageChange($event)"
        (bookingDeleted)="loadBookings()"
      ></app-bookings-list>
    }
  </div>
</div>
