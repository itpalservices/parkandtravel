<div class="sidebar-overlay" [class.active]="isOpen" (click)="onClose()"></div>
<aside class="sidebar" [class.open]="isOpen" [class.collapsed]="collapsed">
  <nav class="sidebar-nav">
    @for (item of navItems$ | async; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [title]="collapsed ? item.label : ''"
        (click)="onNavClick()"
      >
        <span class="nav-icon">
          @switch (item.icon) {
            @case ('home') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            }
            @case ('bookings') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            }
            @case ('customers') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            }
            @case ('reports') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
            }
            @case ('drivers') {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
                <line x1="12" y1="2" x2="12" y2="9"></line>
                <line x1="4.22" y1="4.22" x2="7.76" y2="7.76"></line>
                <line x1="2" y1="12" x2="9" y2="12"></line>
                <line x1="19.78" y1="4.22" x2="16.24" y2="7.76"></line>
                <line x1="22" y1="12" x2="15" y2="12"></line>
              </svg>
            }
          }
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>
  <button
    type="button"
    class="collapse-toggle-btn d-none d-md-flex"
    (click)="onToggleCollapse()"
    [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
    [title]="collapsed ? 'Expand sidebar' : ''"
  >
    <span class="nav-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (collapsed) {
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        } @else {
          <polyline points="11 17 6 12 11 7"></polyline>
          <polyline points="18 17 13 12 18 7"></polyline>
        }
      </svg>
    </span>
    <span class="nav-label">Collapse</span>
  </button>
</aside>
