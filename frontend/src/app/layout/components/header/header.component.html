<header class="app-header">
  <div class="header-left">
    <button class="hamburger-btn d-md-none" (click)="onToggleSidebar()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="logo">
      <span class="logo-text">Park & Travel</span>
    </div>
  </div>
  <div class="header-right">
    @if (user$ | async; as user) {
      <a routerLink="/admin/user-profile" class="user-info-link">
        <div class="user-info">
          <div class="avatar-wrapper">
            @if (user.picture) {
              <img [src]="user.picture" [alt]="user.name" class="user-avatar" />
            } @else {
              <div class="user-avatar-placeholder">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
            }
            @if (!(emailVerified$ | async)) {
              <span class="verification-badge"></span>
            }
          </div>
          <span class="user-name d-none d-md-inline">{{ displayName$ | async }}</span>
        </div>
      </a>
    }
    <button class="logout-btn" (click)="logout()" title="Logout">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</header>
